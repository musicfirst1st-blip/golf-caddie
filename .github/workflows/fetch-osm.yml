name: fetch-osm
on:
  push:
    paths: [".github/workflows/fetch-osm.yml"]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Query Overpass (backoff, several servers)
        shell: python
        run: |
          import json, time, urllib.request, urllib.parse, os
          os.makedirs("data", exist_ok=True)
          servers = ["https://overpass-api.de/api/interpreter",
                     "https://overpass.private.coffee/api/interpreter",
                     "https://maps.mail.ru/osm/tools/overpass/api/interpreter",
                     "https://overpass.kumi.systems/api/interpreter"]
          areas = {"yangji": "37.192,127.272,37.230,127.315", "monarch": "36.982,127.605,37.022,127.652"}
          log = []
          for name, bb in areas.items():
              q = f'[out:json][timeout:90];(nwr["golf"]({bb});nwr["leisure"="golf_course"]({bb});way["natural"="water"]({bb}););out geom tags;'
              body = urllib.parse.urlencode({"data": q}).encode()
              ok = False; wait = 10
              for attempt in range(8):
                  for url in servers:
                      try:
                          req = urllib.request.Request(url, data=body, headers={"User-Agent": "golf-caddie/1.0 (personal project; github.com/musicfirst1st-blip/golf-caddie)", "Accept": "application/json"})
                          raw = urllib.request.urlopen(req, timeout=120).read()
                          d = json.loads(raw)
                          open(f"data/osm-{name}.json", "w").write(json.dumps(d, ensure_ascii=False))
                          log.append(f"{name}: OK {url} {len(d.get('elements', []))} elements"); ok = True; break
                      except Exception as e:
                          log.append(f"{name}: attempt {attempt} {url} -> {type(e).__name__} {str(e)[:80]}")
                  if ok: break
                  time.sleep(wait); wait = min(wait * 2, 120)
          open("data/log.txt", "w").write("\n".join(log))
          print("\n".join(log))
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data && git commit -m "OSM 골프 데이터 가져오기" && git push || echo "no changes"
