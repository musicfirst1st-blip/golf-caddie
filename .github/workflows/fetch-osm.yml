name: fetch-osm
on:
  push:
    paths: [".github/workflows/fetch-osm.yml"]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Query Overpass
        run: |
          mkdir -p data
          q() { # $1=name $2=bbox(s,w,n,e)
            Q="[out:json][timeout:90];(nwr[\"golf\"]($2);nwr[\"leisure\"=\"golf_course\"]($2);way[\"natural\"=\"water\"]($2););out geom tags;"
            for url in https://overpass-api.de/api/interpreter https://overpass.kumi.systems/api/interpreter https://overpass.private.coffee/api/interpreter; do
              curl -sS -m 120 -X POST "$url" \
                -H "User-Agent: golf-caddie/1.0 (https://github.com/musicfirst1st-blip/golf-caddie)" \
                -H "Accept: application/json" \
                --data-urlencode "data=$Q" -o "data/osm-$1.json" || true
              head -c 1 "data/osm-$1.json" | grep -q "{" && break
              echo "retry other server ($url failed)"; sleep 5
            done
            echo "$1: $(python3 -c "import json;d=json.load(open('data/osm-$1.json'));print(len(d.get('elements',[])),'elements')")"
          }
          q yangji 37.192,127.272,37.230,127.315
          q monarch 36.982,127.605,37.022,127.652
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data && git commit -m "OSM 골프 데이터 가져오기" && git push || echo "no changes"
